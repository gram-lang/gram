name: Nightly Maintenance & Audit

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  security-and-audit:
    name: Security, Deduplication & Vocabulary Audit
    runs-on: docker
    container:
      image: oven/bun:1.3.14
    steps:
      - name: Install Git
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
          git config --global --add safe.directory '*'

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lockfile Deduplication Check
        run: bun run dedupe:check

      - name: Dependencies CVE Audit
        run: bun audit --audit-level=high

      - name: Content Vocabulary Audit
        run: bun run audit
        continue-on-error: true
