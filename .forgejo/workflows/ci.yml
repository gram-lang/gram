name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.agents/**'
      - '.claude/**'
      - '.changeset/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - '.agents/**'
      - '.claude/**'
      - '.changeset/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Test & Publish
    runs-on: docker
    container:
      image: oven/bun:1.3.14
    steps:
      - name: Install Git, Node.js & Tools
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates curl
          git config --global --add safe.directory '*'
          curl -fsSL https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.gz | tar -xz -C /usr/local --strip-components=1

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs-relevant changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # No usable base (first push to a branch, force-push, shallow edge case): run docs build to be safe.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -qE '^packages/(docs|renderer)/'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Bun & Turbo
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build Core Packages
        run: |
          bun run build --filter='!@gram-lang/docs'
          git diff --exit-code packages/parser/src/grammar-content.ts

      - name: Build Docs
        if: steps.filter.outputs.docs == 'true'
        run: bun run build --filter='@gram-lang/docs'

      - name: Lint, Typecheck & Ratchet
        run: |
          bun run lint
          bun run typecheck
          bun run any-ratchet

      - name: Unit Tests
        run: bun test

      - name: Conformance Suite
        run: bun run conformance

      - name: Pack CLI Packages
        run: |
          mkdir -p .smoke
          for p in i18n format parser modules kitchen analyzer renderer cli; do (cd packages/$p && bun pm pack --destination ../../.smoke); done

      - name: Node.js Smoke Tests
        run: |
          export REPO_DIR=$(pwd)
          mkdir -p /tmp/smoke-install && cd /tmp/smoke-install
          npm init -y
          npm install $REPO_DIR/.smoke/*.tgz
          node_modules/.bin/gram check $REPO_DIR/packages/kitchen/tests/fixtures/valid/simple_recipe.gram
          node_modules/.bin/gram build $REPO_DIR/packages/kitchen/tests/fixtures/valid/simple_recipe.gram | node -e 'JSON.parse(require("fs").readFileSync(0, "utf-8"))'
          node_modules/.bin/gram --help > /dev/null
          ! node_modules/.bin/gram build $REPO_DIR/conformance/cases/err-001-invalid-composite-spacing/input.gram > /dev/null 2>&1
          echo "broken: {physical: {density: not-a-number}}" > /tmp/bad-db.yaml
          node_modules/.bin/gram build $REPO_DIR/packages/kitchen/tests/fixtures/valid/simple_recipe.gram --db /tmp/bad-db.yaml 2>/tmp/bad-db-stderr.txt | node -e 'JSON.parse(require("fs").readFileSync(0, "utf-8"))' > /dev/null
          grep -q "Ignoring 1 invalid ingredient" /tmp/bad-db-stderr.txt
          export GRAM_BIN=$(pwd)/node_modules/.bin/gram
          mkdir -p /tmp/env-smoke && cd /tmp/env-smoke
          echo "GEMINI_API_KEY=fake-key-for-smoke-test" > .env
          ! $GRAM_BIN import does-not-exist.gram 2>/tmp/env-smoke-stderr.txt
          ! grep -q 'No AI provider configured' /tmp/env-smoke-stderr.txt

      - name: Publish changesets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
          node scripts/resolve-workspace-versions.cjs
          npx changeset publish
