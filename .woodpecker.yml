when:
  - event: push
    branch: main
  - event: pull_request

steps:
  install:
    image: oven/bun:1.3.14
    commands:
      - bun install

  # Explicit and separate from `install`'s postinstall hook (which already runs
  # this implicitly): if that hook is ever removed or broken, typecheck/test
  # would otherwise silently run against stale dist/ output instead of failing.
  build:
    image: oven/bun:1.3.14
    commands:
      - apt-get update && apt-get install -y git
      - bun run build
      # `prebuild` just regenerated grammar-content.ts from grammar.ohm — fail
      # here if a PR edited the grammar without committing the regenerated
      # file, instead of letting src/ and the committed artifact silently
      # diverge (audit 2026-07-22, parser I10).
      - git diff --exit-code packages/parser/src/grammar-content.ts

  lint:
    image: oven/bun:1.3.14
    commands:
      - bun run lint

  typecheck:
    image: oven/bun:1.3.14
    commands:
      - bun run typecheck

  # `lint` above only fails on biome errors, not warnings — and `noExplicitAny`
  # is off/warn-only in several packages (see biome.json). This ratchet catches
  # regressions in those packages by comparing against a checked-in baseline
  # (audit 2026-07-22, meta-finding on `bun run lint` exiting 0 with warnings).
  any-ratchet:
    image: oven/bun:1.3.14
    commands:
      - bun run any-ratchet

  test:
    image: oven/bun:1.3.14
    commands:
      - apt-get update && apt-get install -y git
      - bun test

  # Packs every @gram-lang/* package the CLI depends on with `bun pm pack`
  # (which resolves `workspace:*` to the real version, same as at publish
  # time) so node-smoke can install them together with plain npm, without
  # depending on the npm registry — these betas may not even be published yet.
  pack:
    image: oven/bun:1.3.14
    commands:
      - mkdir -p .smoke
      - for p in i18n format parser kitchen analyzer renderer cli; do (cd packages/$p && bun pm pack --destination ../../.smoke); done

  # Confirms the CLI actually works when installed the way most users get
  # it — `npm install` on plain Node.js, no Bun anywhere — since the docs
  # promise Node >=20 support and every other CI step runs under Bun.
  #
  # Also closes the audit's "4th mechanism" (2026-07-22, §6.3): every other
  # CI step imports packages as modules under Bun, so none of it exercises
  # the published binary the way a real user does. This step must actually
  # invoke `gram` under Node, not just import it.
  node-smoke:
    image: node:20
    commands:
      - apt-get update && apt-get install -y jq
      - export REPO_DIR=$(pwd)
      - mkdir -p /tmp/smoke-install && cd /tmp/smoke-install
      - npm init -y
      - npm install $REPO_DIR/.smoke/*.tgz
      - node_modules/.bin/gram check $REPO_DIR/packages/kitchen/tests/fixtures/valid/simple_recipe.gram
      # stdout purity: `gram build` must emit nothing but the compiled JSON on
      # stdout, so piping into `jq`/downstream tooling never breaks.
      - node_modules/.bin/gram build $REPO_DIR/packages/kitchen/tests/fixtures/valid/simple_recipe.gram | jq . > /dev/null
      - node_modules/.bin/gram --help > /dev/null
      # a syntactically invalid recipe must fail loudly (non-zero exit), not
      # silently succeed with empty/partial output.
      - "! node_modules/.bin/gram build $REPO_DIR/conformance/cases/err-001-invalid-composite-spacing/input.gram > /dev/null 2>&1"
      # stdout purity, malformed-database case (audit 2026-07-22, cli finding
      # B-3): an invalid ingredient DB entry used to log its warning via
      # `log.warn` (@clack/prompts), which writes to stdout — corrupting
      # `gram build | jq` the moment any entry failed validation. The warning
      # must land on stderr, and stdout must stay valid, parseable JSON.
      - 'echo "broken: {physical: {density: not-a-number}}" > /tmp/bad-db.yaml'
      - node_modules/.bin/gram build $REPO_DIR/packages/kitchen/tests/fixtures/valid/simple_recipe.gram --db /tmp/bad-db.yaml 2>/tmp/bad-db-stderr.txt | jq . > /dev/null
      - grep -q "Ignoring 1 invalid ingredient" /tmp/bad-db-stderr.txt
      # .env loaded under Node (audit 2026-07-22, cli finding B-2): only Bun
      # auto-loads `.env` — `gram init`/`gram config set` both write API keys
      # there, so a published binary (shebang #!/usr/bin/env node) silently
      # ignored it. A nonexistent local path as the import source makes this
      # fail fast on "file not found" (proving the AI-provider gate was
      # passed) instead of making a real network call.
      - export GRAM_BIN=$(pwd)/node_modules/.bin/gram
      - mkdir -p /tmp/env-smoke && cd /tmp/env-smoke
      - 'echo "GEMINI_API_KEY=fake-key-for-smoke-test" > .env'
      - "! $GRAM_BIN import does-not-exist.gram 2>/tmp/env-smoke-stderr.txt"
      - "! grep -q 'No AI provider configured' /tmp/env-smoke-stderr.txt"
      - cd /tmp/smoke-install

  # Non-blocking for now: several known vulnerabilities are tracked and scheduled
  # to be resolved (dependency updates, see audit Chantier 5). Once addressed,
  # remove `failure: ignore` so new vulnerabilities start failing the build.
  audit:
    image: oven/bun:1.3.14
    commands:
      - bun audit
    failure: ignore

  # node:20, not bun: @changesets/cli always shells out to the literal `npm`
  # binary to publish (see getPublishTool in @changesets/cli) regardless of
  # whether it's invoked via bunx or npx, and the bun image has no `npm` on
  # PATH at all (hence the earlier "Executable not found in $PATH: npm").
  # `resolve-workspace-versions.cjs` runs first to rewrite `workspace:*`
  # ranges to real pinned versions on disk, since npm doesn't understand that
  # protocol and would otherwise publish it verbatim into the manifest.
  publish:
    image: node:20
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
      - node scripts/resolve-workspace-versions.cjs
      - npx changeset publish
    when:
      event: push
      branch: main
